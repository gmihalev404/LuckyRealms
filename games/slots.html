<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dragon's Fortune | LuckyRealms</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/slots.css">
</head>

<body>

    <header class="navbar">
        <a href="../index.html" class="logo">
            Lucky<span>Realms</span>
        </a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#games">Games</a>
            <a href="../index.html#about">About</a>
        </nav>

        <div class="balance">
            <span>Balance</span>
            <strong id="balance">1000</strong>
            <span>credits</span>
        </div>
    </header>


    <main class="slot-page">

        <section class="slot-header">
            <p class="slot-subtitle" id="realm-label"></p>

            <h1 id="game-title"></h1>

            <p id="game-description"></p>
        </section>


        <section class="slot-machine">
            <div class="slot-toolbar">

                <button class="sound-toggle" id="sound-toggle" type="button">
                    🔊 SFX
                </button>

                <button class="sound-toggle" id="music-toggle" type="button">
                    🎵 Music
                </button>

                <div class="volume-control">
                    <span>🔉</span>

                    <input type="range" id="volume-slider" min="0" max="100" step="1" aria-label="Volume">
                </div>

            </div>
            <div class="slot-grid" id="slot-grid">

            </div>


            <div class="game-message" id="game-message">
                Place your bet and spin.
            </div>

            <div class="win-breakdown" id="win-breakdown"></div>


            <div class="slot-controls">


                <div class="bet-control">
                    <span>Bet</span>

                    <div class="bet-buttons">
                        <button id="decrease-bet">−</button>

                        <strong id="bet">10</strong>

                        <button id="increase-bet">+</button>
                    </div>
                </div>

                <button class="spin-button" id="spin-button">
                    SPIN
                </button>

                <div class="win-display">
                    <span>Last Win</span>
                    <strong id="last-win">0</strong>
                </div>

            </div>

            <div class="game-stats">

                <div class="stat">
                    <span>Spins</span>
                    <strong id="total-spins">0</strong>
                </div>

                <div class="stat">
                    <span>Wins</span>
                    <strong id="total-wins">0</strong>
                </div>

                <div class="stat">
                    <span>Biggest Win</span>
                    <strong id="biggest-win">0</strong>
                </div>

                <div class="stat">
                    <span>Free Spins</span>
                    <strong id="free-spins">0</strong>
                </div>

            </div>

            <button class="refill-button" id="refill-button" hidden>
                Refill 1000 Credits
            </button>
        </section>


        <section class="paytable">
            <h2>Paytable</h2>

            <div class="paytable-grid" id="paytable-grid">
            </div>

            <p id="paytable-description"></p>
        </section>

    </main>


    <footer>
        <p>© 2026 LuckyRealms</p>
        <p>Virtual credits only. No real-money gambling.</p>
    </footer>


    <script src="../js/game-configs.js"></script>
    <script src="../js/sound.js"></script>
    <script src="../js/slots.js"></script>

</body>

</html>
